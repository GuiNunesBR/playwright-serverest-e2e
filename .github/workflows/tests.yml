name: Testes

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '0 11 * * 1-5'   # dias úteis, 08:00 em Brasília
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: testes-${{ github.ref }}
  cancel-in-progress: true

jobs:
  testes:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Imagem oficial com Chromium e dependências já instalados (sem apt-get a cada execução).
    # A tag precisa acompanhar a versão do @playwright/test no package-lock.json.
    container:
      image: mcr.microsoft.com/playwright:v1.65.0-noble
      options: --user 1001
    outputs:
      relatorio: ${{ steps.pages.outcome }}
    steps:
      - uses: actions/checkout@v7
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Guarda o relatório HTML
        if: ${{ !cancelled() && hashFiles('playwright-report/index.html') != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
      - name: Prepara a publicação do relatório
        id: pages
        if: ${{ !cancelled() && github.ref == 'refs/heads/main' && hashFiles('playwright-report/index.html') != '' }}
        uses: actions/upload-pages-artifact@v5
        with:
          path: playwright-report/

  publicar-relatorio:
    if: ${{ !cancelled() && needs.testes.outputs.relatorio == 'success' }}
    needs: testes
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v5
